name: CI

on:
  push:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: lifeboard
          POSTGRES_PASSWORD: lifeboard
          POSTGRES_DB: lifeboard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lifeboard -d lifeboard_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql://lifeboard:lifeboard@localhost:5432/lifeboard_test
      SESSION_SECRET_KEY: ci-only-session-secret
      APP_ENV: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -q
